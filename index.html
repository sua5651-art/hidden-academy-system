<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6feb">
<meta name="description" content="학원 수업 기록을 입력하면 학부모 전달용 피드백 문장을 자동으로 만들어 주는 앱">
<title>수업 피드백 자동 생성</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="appbar">
  <button class="appbar__back" id="backBtn" hidden aria-label="뒤로 가기">‹</button>
  <h1 class="appbar__title" id="appTitle">수업 피드백</h1>
  <span class="appbar__sub" id="appSub"></span>
</header>

<main id="view" class="view" role="main"></main>

<nav class="tabbar" role="navigation" aria-label="주요 화면">
  <a class="tab" href="#/home"     data-tab="home"><span class="tab__icon">🏠</span><span>홈</span></a>
  <a class="tab" href="#/students" data-tab="students"><span class="tab__icon">👥</span><span>학생</span></a>
  <a class="tab" href="#/lessons"  data-tab="lessons"><span class="tab__icon">📋</span><span>수업</span></a>
  <a class="tab" href="#/homeworks" data-tab="homeworks"><span class="tab__icon">📚</span><span>숙제</span></a>
  <a class="tab" href="#/settings" data-tab="settings"><span class="tab__icon">⚙️</span><span>설정</span></a>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- 확인 대화상자 -->
<div class="modal" id="confirmModal" hidden>
  <div class="modal__box" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <h3 id="confirmTitle">확인</h3>
    <p id="confirmText"></p>
    <div class="modal__actions">
      <button class="btn btn--ghost" id="confirmCancel">취소</button>
      <button class="btn btn--danger" id="confirmOk">확인</button>
    </div>
  </div>
</div>

<script src="assets/js/store.js"></script>
<script src="assets/js/feedback.js"></script>
<script src="assets/js/homework.js"></script>
<script src="assets/js/counsel.js"></script>
<script src="assets/js/ai.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
